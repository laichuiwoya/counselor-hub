spring.application.name=counselor-system
spring.config.import=classpath:jdbc.properties
server.port=${APP_PORT:8080}
server.servlet.context-path=/
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.session.timeout=30m
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:${jdbc.url}}
spring.datasource.username=${DB_USERNAME:${jdbc.username}}
spring.datasource.password=${DB_PASSWORD:${jdbc.password}}
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
spring.mvc.format.date=yyyy-MM-dd
spring.mvc.format.date-time=yyyy-MM-dd'T'HH:mm
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.jackson.time-zone=Asia/Shanghai
mybatis.config-location=classpath:mybatis-config.xml
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.counselor.entity
app.upload-dir=${UPLOAD_DIR:./uploads}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/operation-log.sql
